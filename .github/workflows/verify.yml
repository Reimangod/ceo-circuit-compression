name: Research artifact CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: research-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_NO_PROGRESS: "1"
  OPENBLAS_NUM_THREADS: "1"
  OMP_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  VECLIB_MAXIMUM_THREADS: "1"
  NUMBA_NUM_THREADS: "1"

jobs:
  repository-checks:
    name: Documentation and workflow checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Check guides, links, SVG assets, scope, and frozen hashes
        run: python tools/check_repository.py --output ci-results/repository.json
      - name: Check deterministic English result views
        run: python tools/build_readme_assets.py --check
      - name: Validate GitHub Actions syntax with a checksum-pinned actionlint
        shell: bash
        run: |
          curl --fail --silent --show-error --location --retry 3 \
            --output "$RUNNER_TEMP/actionlint.tar.gz" \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color
      - name: Summarize checkout checks
        run: python tools/ci_summary.py ci-results/repository.json --title "Checkout consistency"
      - name: Retain the checkout report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: repository-checks
          path: ci-results/
          retention-days: 7
          if-no-files-found: warn

  tests:
    name: Synthetic and unit tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          version: "0.9.8"
          python-version: ${{ matrix.python }}
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install locked numerical and test dependencies
        run: uv sync --frozen --python "${{ matrix.python }}" --extra policy --extra report --extra test
      - name: Run synthetic numerical and checkout tests
        run: uv run --frozen --no-sync python -m pytest -q --junitxml=ci-results/tests.xml
      - name: Retain test results and skip information
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: unit-tests-python-${{ matrix.python }}
          path: ci-results/
          retention-days: 7
          if-no-files-found: warn

  macos-isolation:
    name: macOS worker isolation (no energy calls)
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          version: "0.9.8"
          python-version: "3.11"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install locked policy dependencies
        run: uv sync --frozen --python 3.11 --extra policy
      - name: Verify import, historical-file denial, and network denial
        run: uv run --frozen --no-sync python tools/check_isolation.py

  saved-data:
    name: Fixed-release data and accounting audit
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          version: "0.9.8"
          python-version: "3.11"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install locked archive-test dependencies
        run: uv sync --frozen --python 3.11 --extra test
      - name: Retrieve the checksum-verified private data release
        run: uv run --frozen --no-sync python tools/fetch_data.py
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Verify raw objects, 66 ledgers, costs, and comparison bindings
        run: uv run --frozen --no-sync python tools/verify.py --output ci-results/archive.json
      - name: Reconstruct all 41 saved condition selections
        run: uv run --frozen --no-sync python tools/reconstruct_census.py
      - name: Reproduce saved tables without molecular execution
        run: uv run --frozen --no-sync python tools/reproduce.py --tables-only --output ci-results/tables
      - name: Run the archive-dependent tests with the data present
        run: uv run --frozen --no-sync python -m pytest -q tests/test_archive_tools.py tests/test_repository_quality.py --junitxml=ci-results/archive-tests.xml
      - name: Summarize saved evidence checks
        run: uv run --frozen --no-sync python tools/ci_summary.py ci-results/archive.json --title "Fixed-release evidence audit"
      - name: Retain reports and reconstructed tables only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: saved-data-audit
          path: ci-results/
          retention-days: 7
          if-no-files-found: warn
