name: Verify research archive
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[policy,report,test]'
      - run: python -m pytest -q
  fixed-release-data:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Retrieve private fixed data
        run: python tools/fetch_data.py
        env:
          GH_TOKEN: ${{ github.token }}
      - run: python tools/verify.py
      - run: python tools/reconstruct_census.py
      - run: python tools/reproduce.py --tables-only
