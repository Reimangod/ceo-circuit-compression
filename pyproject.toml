[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ceo-circuit-compression"
version = "1.0.0"
description = "Code and full-orbital data for a bounded CEO circuit compression study"
requires-python = ">=3.11,<3.13"
license = "Apache-2.0"
authors = [{name = "Rei Watanabe"}]
dependencies = []

[project.optional-dependencies]
report = ["Pillow>=11,<13", "python-docx>=1.1,<2", "lxml>=5,<7"]
policy = ["numpy==2.4.6", "scipy==1.17.1", "sympy==1.14.0", "qiskit==2.6.0"]
test = ["pytest>=8,<10"]

[tool.setuptools]
py-modules = []

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
